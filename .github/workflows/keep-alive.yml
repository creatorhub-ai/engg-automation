name: Keep Render Backend Alive

on:
  schedule:
    #  Runs every 10 minutes
    #  Format: minute hour day month weekday
    - cron: '*/10 * * * *'

  # Allows you to manually trigger the workflow from GitHub UI
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Backend
    runs-on: ubuntu-latest

    steps:
      - name: Ping the backend health endpoint
        run: |
          echo "Pinging backend at $(date)..."

          RESPONSE=$(curl --silent --write-out "HTTPSTATUS:%{http_code}" \
            --max-time 30 \
            "${{ secrets.RENDER_BACKEND_URL }}/api/health")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTPSTATUS:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')

          echo "Response body: $HTTP_BODY"
          echo "HTTP status code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Backend is UP and running!"
          else
            echo "❌ Backend returned status $HTTP_STATUS"
            exit 1
          fi
